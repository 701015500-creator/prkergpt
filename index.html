<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrkerGPT</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--green:#10a37f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:16px/1.5 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#303030,#171717 70%)}.login{width:min(420px,100%);padding:32px;border:1px solid #3a3a3a;border-radius:22px;background:#202020}.logo{width:46px;height:46px;border-radius:14px;background:var(--green);display:grid;place-items:center;font-weight:800;font-size:23px;margin-bottom:18px}h1{font-size:26px;margin:0 0 6px}.login p{color:#aaa;margin:0 0 22px}.login input{width:100%;padding:13px;border:1px solid #505050;border-radius:12px;background:#151515;color:white}.login button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700}#error{color:#ff8989;min-height:24px;margin-top:8px;font-size:14px}
#app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:var(--panel);padding:18px;border-right:1px solid #292929;display:flex;flex-direction:column;gap:20px}.brand{font-size:20px;font-weight:750}.brand span{color:var(--green)}.new{border:1px solid #444;background:transparent;color:white;border-radius:10px;padding:10px;text-align:left}.sidebottom{margin-top:auto;color:#777;font-size:12px}.main{margin-left:245px;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}.top{width:min(800px,100%);display:flex;justify-content:space-between}.pill{font-size:12px;border:1px solid #454545;border-radius:99px;padding:5px 9px;color:#bbb}.content{width:min(800px,100%);flex:1;display:flex;flex-direction:column;padding:40px 0;overflow:auto}.welcome{text-align:center;margin:auto 0}.welcome h2{font-size:clamp(28px,4vw,38px);margin:0 0 10px}.welcome p{color:#aaa;margin-bottom:28px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.suggestion{padding:15px;background:#292929;border:1px solid #414141;border-radius:14px;color:#eee;text-align:left}.messages{display:flex;flex-direction:column;gap:22px;margin:20px 0}.msg{white-space:pre-wrap;overflow-wrap:anywhere;max-width:95%;padding:13px 16px;border-radius:16px}.user{align-self:flex-end;background:#303030}.bot{align-self:flex-start;background:#292929}.composer{width:min(800px,100%);border:1px solid #494949;border-radius:18px;background:#2a2a2a;padding:10px;display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:none;min-height:28px;max-height:140px;flex:1;background:transparent;color:white;border:0;outline:none;padding:7px}.send{width:38px;height:38px;border:0;border-radius:12px;background:var(--green);color:white;font-size:20px}.hint{font-size:11px;color:#777;text-align:center;margin-top:12px}@media(max-width:700px){.sidebar{position:static;width:auto;height:auto;flex-direction:row;align-items:center;border:0;border-bottom:1px solid #292929}.new{margin-left:auto}.sidebottom{display:none}.main{margin:0;padding:18px}.suggestions{grid-template-columns:1fr}}
</style></head><body>
<section id="gate"><form class="login" id="loginForm"><div class="logo">P</div><h1>Welcome to PrkerGPT</h1><p>Enter the access code to continue.</p><input id="password" type="password" placeholder="Access code" autocomplete="current-password" aria-label="Access code" required><button>Unlock PrkerGPT</button><div id="error" role="status"></div></form></section>
<div id="app"><aside class="sidebar"><div class="brand">Prker<span>GPT</span></div><button class="new" id="newChat">＋ New chat</button><div class="sidebottom">PrkerGPT · AI + web search</div></aside>
<main class="main"><div class="top"><strong>PrkerGPT</strong><span class="pill">AI + Web Search</span></div><section class="content" id="content"><div class="welcome" id="welcome"><h2>What’s on your mind?</h2><p>Ask a question or search for something current.</p><div class="suggestions"><button class="suggestion">Why is the sky blue?</button><button class="suggestion">Find the latest news about space</button><button class="suggestion">Help me understand my homework</button><button class="suggestion">Give me a weird fun fact</button></div></div><div class="messages" id="messages"></div></section>
<form class="composer" id="chatForm"><textarea id="prompt" rows="1" placeholder="Ask PrkerGPT anything..." aria-label="Ask PrkerGPT" required></textarea><button class="send" id="send" aria-label="Send message">↑</button></form><div class="hint">AI answers may be wrong. Web search is used when helpful. Keep your access code private.</div></main></div>
<script>
const gate=document.getElementById('gate'),app=document.getElementById('app'),pass=document.getElementById('password');let accessCode='',history=[];
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();accessCode=pass.value;gate.style.display='none';app.style.display='block';document.getElementById('prompt').focus()});
const messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),promptBox=document.getElementById('prompt'),sendBtn=document.getElementById('send');
function addMessage(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;messages.appendChild(el);return el}
async function send(text){text=text.trim();if(!text||sendBtn.disabled)return;welcome.style.display='none';addMessage(text,'user');const pending=addMessage('Thinking…','bot');sendBtn.disabled=true;history.push({role:'user',content:text});
try{const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json','x-site-password':accessCode},body:JSON.stringify({input:text,history:history.slice(-10,-1)})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');pending.textContent=data.answer||'I could not get an answer.';history.push({role:'assistant',content:pending.textContent})}catch(err){pending.textContent='Oops — '+(err.message||'Something went wrong. Check your setup.')}finally{sendBtn.disabled=false;document.getElementById('content').scrollTop=document.getElementById('content').scrollHeight;promptBox.focus()}}
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();send(promptBox.value);promptBox.value=''});document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>send(b.textContent)));document.getElementById('newChat').addEventListener('click',()=>{messages.replaceChildren();welcome.style.display='block';history=[];promptBox.value=''});promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatForm').requestSubmit()}});
</script></body></html>
